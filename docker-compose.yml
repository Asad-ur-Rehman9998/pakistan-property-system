services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build: .
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DJANGO_API_URL: http://api:8000
    volumes:
      - pehle-data:/app/data
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build: ./api
    expose:
      - "8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-dev-only-change-me}
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://propertycheck:propertycheck@db:5432/propertycheck
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: miniominio
      AWS_STORAGE_BUCKET_NAME: propertycheck-checks
      AWS_REGION: us-east-1
    depends_on:
      db:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: propertycheck
      POSTGRES_PASSWORD: propertycheck
      POSTGRES_DB: propertycheck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propertycheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    volumes:
      - minio:/data
    restart: unless-stopped

  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set local http://minio:9000 minio miniominio;
      mc mb -p local/propertycheck-checks || true;
      exit 0;
      "

volumes:
  pehle-data:
  pgdata:
  minio:
